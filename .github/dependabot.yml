# Weekly dependency updates (docs/security-review.md). Grouped so each week is one PR to review;
# majors come separately because they need reading release notes (Prisma, TypeScript are pinned on
# purpose, see CLAUDE.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: prisma
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@prisma/*'
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
